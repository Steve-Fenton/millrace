<svg width="196" height="200" viewBox="10 50 196 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Water wheel</title>
  <desc>A stylized water wheel with spokes and paddles.</desc>

  <!-- Accent: app.css --accent (#38bdf8). Channel: sky-800 (#075985). Hub: #0369a1 -->
  <g>
    <circle cx="108" cy="150" r="90" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.28"/>
    <circle cx="108" cy="150" r="85" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>

    <g stroke="#075985" stroke-width="3">
      <line x1="108" y1="150" x2="108" y2="65"/>
      <line x1="108" y1="150" x2="168" y2="90"/>
      <line x1="108" y1="150" x2="193" y2="150"/>
      <line x1="108" y1="150" x2="23" y2="150"/>
      <line x1="108" y1="150" x2="48" y2="90"/>
    </g>

    <g stroke="#38bdf8" stroke-width="3.5" opacity="0.92">
      <line x1="108" y1="150" x2="168" y2="210"/>
      <line x1="108" y1="150" x2="108" y2="235"/>
      <line x1="108" y1="150" x2="48" y2="210"/>
    </g>

    <g fill="#38bdf8" opacity="0.78">
