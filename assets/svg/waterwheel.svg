      <rect x="94" y="57" width="28" height="10" rx="2" transform="rotate(225 108 150)"/>
      <rect x="94" y="57" width="28" height="10" rx="2" transform="rotate(270 108 150)"/>
      <rect x="94" y="57" width="28" height="10" rx="2" transform="rotate(315 108 150)"/>
    </g>

    <circle cx="108" cy="150" r="18" fill="#38bdf8"/>
    <circle cx="108" cy="150" r="9" fill="#0369a1"/>
