      <rect x="94" y="57" width="28" height="10" rx="2" transform="rotate(45 108 150)"/>
      <rect x="94" y="57" width="28" height="10" rx="2" transform="rotate(90 108 150)"/>
      <rect x="94" y="57" width="28" height="10" rx="2" transform="rotate(135 108 150)"/>
