id = FLOW-mwwjmzjn-9ggyhy
title = Recurring Cards
description = It should be possible to mark a card as recurring and set an interval for that to happen.
    
    When the next action date is reached, it will create the duplicate, move it to "to do" and update the next action date based on the interval settings.
    
    This will only run if the current user owns the card, so if you're on holiday your cards won't create copies. You'll get one copy when you return, rather than "one for every week you were out" cluttering up the board.
    
    The recurring cards can be shown in a more compact form on the board.
